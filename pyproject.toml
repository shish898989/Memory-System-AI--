[project]
name = "memory-system"
version = "0.1.0"
description = "Memory System для AI-ассистента: забывание, объединение похожих фактов, разрешение противоречий, долгосрочный профиль"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
